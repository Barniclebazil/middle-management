<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Middle Management sprite gallery</title>
<style>
  html, body { margin: 0; background: #1e1e24; color: #d8d4cc; font: 13px/1.4 system-ui, sans-serif; }
  h2 { margin: 18px 16px 6px; font-size: 15px; color: #f0e6d0; }
  .note { margin: 0 16px 8px; color: #9a958c; }
  canvas { image-rendering: pixelated; display: block; }
  .wrap { padding: 0 16px 16px; overflow-x: auto; }
  .cells { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 4px; }
  .cap { color: #b9b3a6; font-size: 11px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="out/gallery.js"></script>
</body>
</html>
