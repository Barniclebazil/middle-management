name: Release

# Tag a release:  git tag v0.1.2 && git push origin v0.1.2
#
# The tag must match the version in package.json (v0.1.2 -> 0.1.2).
# This builds the .vsix and attaches it to a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version '$tag_version' does not match package.json version '$pkg_version'"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run package

      - uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
